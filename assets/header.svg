<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="0.6" stop-color="#0F2A1C"/>
      <stop offset="1" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#22C55E" stroke-opacity="0.08"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; }
    .role { opacity: 0; animation: cycle 12s infinite; animation-fill-mode: both; }
    .r1 { animation-delay: 0s; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .r4 { animation-delay: 9s; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(8px); }
      4% { opacity: 1; transform: translateY(0); }
      22% { opacity: 1; transform: translateY(0); }
      26% { opacity: 0; transform: translateY(-8px); }
      100% { opacity: 0; }
    }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
  </style>

  <rect width="900" height="280" rx="18" fill="url(#bg)"/>
  <rect width="900" height="280" rx="18" fill="url(#grid)"/>

  <circle cx="150" cy="60" r="90" fill="#22C55E" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="150;300;150" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="230" r="100" fill="#16A34A" opacity="0.35" filter="url(#blur)">
    <animate attributeName="cx" values="760;620;760" dur="11s" repeatCount="indefinite"/>
  </circle>

  <rect x="0.5" y="0.5" width="899" height="279" rx="18" fill="none" stroke="#22C55E" stroke-opacity="0.35"/>

  <text x="60" y="62" class="mono pulse" font-size="14" fill="#4ADE80">&gt; hello, world_</text>
  <text x="60" y="140" class="mono" font-size="68" font-weight="700" fill="url(#name)">David Isoni</text>

  <g class="mono" font-size="22" fill="#86EFAC">
    <text class="role r1" x="62" y="190">Backend Engineer · Java &amp; Spring Boot</text>
    <text class="role r2" x="62" y="190">Building AI-powered products</text>
    <text class="role r3" x="62" y="190">Smart contract security · NEAR</text>
    <text class="role r4" x="62" y="190">Engineering meets design</text>
  </g>
  <rect class="cursor" x="62" y="214" width="12" height="3" fill="#22C55E"/>

  <text x="840" y="250" text-anchor="end" class="mono" font-size="13" fill="#4ADE80" opacity="0.7">Lagos, Nigeria</text>
</svg>

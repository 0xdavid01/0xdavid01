<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22C55E" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="900" height="280" rx="16"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'JetBrains Mono','SF Mono',Consolas,'Courier New',monospace; }
    .row { opacity: 0; animation: rise 0.6s ease-out forwards; }
    .a { animation-delay: 0.2s; } .b { animation-delay: 0.6s; }
    .c { animation-delay: 1.0s; } .d { animation-delay: 1.4s; }
    @keyframes rise { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: translateX(0); } }
  </style>

  <rect width="900" height="280" rx="16" fill="#0D1117"/>
  <rect x="0.5" y="0.5" width="899" height="279" rx="16" fill="none" stroke="#22C55E" stroke-opacity="0.4"/>

  <g clip-path="url(#clip)">
    <rect x="-200" y="0" width="200" height="280" fill="url(#scan)">
      <animate attributeName="x" values="-200;900" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="40" y="50" class="mono" font-size="15" fill="#4ADE80">~/now <tspan fill="#8B949E">— what I'm working on</tspan></text>
  <line x1="40" y1="66" x2="860" y2="66" stroke="#22C55E" stroke-opacity="0.25"/>

  <g class="mono" font-size="16">
    <g class="row a">
      <circle cx="48" cy="98" r="5" fill="#22C55E"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
      <text x="70" y="104" font-weight="700" fill="#FFFFFF">BUILDING</text>
      <text x="190" y="104" fill="#86EFAC">PayProof · freelance escrow on NEAR</text>
    </g>
    <g class="row b">
      <circle cx="48" cy="146" r="5" fill="#22C55E"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.4s" repeatCount="indefinite"/></circle>
      <text x="70" y="152" font-weight="700" fill="#FFFFFF">SHIPPING</text>
      <text x="190" y="152" fill="#86EFAC">AEGIS CLI · Java, Spring Boot, Claude API</text>
    </g>
    <g class="row c">
      <circle cx="48" cy="194" r="5" fill="#22C55E"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="0.8s" repeatCount="indefinite"/></circle>
      <text x="70" y="200" font-weight="700" fill="#FFFFFF">EXPLORING</text>
      <text x="190" y="200" fill="#86EFAC">AxionFi · AI meets DeFi</text>
    </g>
    <g class="row d">
      <circle cx="48" cy="242" r="5" fill="#22C55E"><animate attributeName="opacity" values="1;0.25;1" dur="1.8s" begin="1.2s" repeatCount="indefinite"/></circle>
      <text x="70" y="248" font-weight="700" fill="#FFFFFF">AUDITING</text>
      <text x="190" y="248" fill="#86EFAC">Smart contract security</text>
    </g>
  </g>
</svg>
